name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux libraries (sound, gamepads, windowing, OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libwayland-dev

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Check every example compiles
        shell: bash
        run: |
          for f in examples/*.nb examples/games/*.nb; do
            ./target/debug/neptune check "$f"
          done

      - name: Plugin end to end
        shell: bash
        run: |
          mkdir -p plugins
          case "$RUNNER_OS" in
            Windows) cp target/debug/neptune_hello_plugin.dll plugins/ ;;
            macOS)   cp target/debug/libneptune_hello_plugin.dylib plugins/ ;;
            Linux)   cp target/debug/libneptune_hello_plugin.so plugins/ ;;
          esac
          ./target/debug/neptune plugins
          ./target/debug/neptune run tests/plugin/plugin_test.nb > out.txt
          diff --strip-trailing-cr out.txt tests/plugin/plugin_test.expected

      - name: Package a game
        shell: bash
        run: |
          ./target/debug/neptune build examples/games/orbrun.nb -o dist/orbrun
          # a packaged game must start too (on macOS the copied program is changed)
          ./target/debug/neptune build tests/package/hello.nb --console -o dist/hello
          ./dist/hello/hello > out.txt
          diff --strip-trailing-cr out.txt tests/package/hello.expected

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets
