[workspace]
resolver = "2"
members = ["crates/neptune-lang", "crates/neptune-vm", "crates/neptune-runtime", "crates/neptune-cli", "crates/neptune-ide", "sdk/rust", "sdk/examples/rust-hello"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Zlib"
repository = "https://github.com/neptunebasic/neptunebasic"

[workspace.dependencies]
neptune-lang = { path = "crates/neptune-lang" }
neptune-vm = { path = "crates/neptune-vm" }
neptune-runtime = { path = "crates/neptune-runtime" }
fyrox = "1.0.1"
iroh = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

[profile.dev.package."*"]
opt-level = 3
# no debug info for dependencies: with Fyrox's size the Windows linker's
# debug database (PDB) otherwise goes over its limit (LNK1318/LNK1140)
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
