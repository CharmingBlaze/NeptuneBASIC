[package]
name = "neptune-runtime"
description = "NeptuneBASIC 3D runtime built on the Fyrox engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neptune-lang.workspace = true
neptune-vm.workspace = true
fyrox.workspace = true
# same version and features Fyrox already builds, so no extra compile cost
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "tga", "tiff", "bmp"] }
gilrs = "0.11.2"
glow = "0.17"
